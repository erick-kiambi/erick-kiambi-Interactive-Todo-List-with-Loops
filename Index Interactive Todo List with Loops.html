<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f4f8;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: #3498db;
            font-size: 15px;
        }

        button:hover {
            background: #2980b9;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .clear-btn {
            margin-top: 15px;
            background: #f39c12;
        }

        .clear-btn:hover {
            background: #d68910;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 5px;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .stats {
            margin-top: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
        }

        .stats p {
            margin: 5px 0;
        }

        .empty-message {
            text-align: center;
            color: gray;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>📝 My Todo List</h1>

    <div class="input-section">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
            onkeypress="if(event.key==='Enter') addTask()"
        >

        <button onclick="addTask()">Add Task</button>
    </div>

    <div id="tasksList">
        <p class="empty-message">No tasks yet. Add one above!</p>
    </div>

    <div class="stats" id="stats">
        <p>Total Tasks: <strong>0</strong></p>
    </div>

    <button class="clear-btn" onclick="clearAll()">Clear All Tasks</button>

</div>

<script src="script.js"></script>

</body>
</html>
